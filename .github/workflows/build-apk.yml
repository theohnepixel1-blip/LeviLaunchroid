name: Build APK (fork)

on:
  push:
    branches:
      - build-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept licenses and install build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Prepare fork build
        run: bash ci/prepare_fork_build.sh

      - name: Set a version name if the repository has no tags
        run: git describe --tags --abbrev=0 || git tag v1.7.1

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -Pdiscord.application_id=0 -x uploadCrashlyticsMappingFileDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
